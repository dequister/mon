name: mon

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mon}:${POSTGRES_PASSWORD:-mon}@postgres:5432/${POSTGRES_DB:-mon}
  QDRANT_URL: http://qdrant:6333
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-por-um-valor-longo-e-aleatorio}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-google}
  DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gemini-3.8-flash}
  DEFAULT_RERANK_MODEL: ${DEFAULT_RERANK_MODEL:-rerank-v4.0-pro}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
  OCR_LANGUAGES: ${OCR_LANGUAGES:-por+eng}
  OCR_DPI: ${OCR_DPI:-300}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  UPLOAD_DIR: /data/uploads
  SOURCES_DIR: /data/sources
  SYSTEM_PROMPT_FILE: /app/SYSTEM_PROMPT.md

x-backend-volumes: &backend-volumes
  - uploads:/data/uploads
  - ./data/sources:/data/sources:ro
  - ./SYSTEM_PROMPT.md:/app/SYSTEM_PROMPT.md:ro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mon}
      POSTGRES_DB: ${POSTGRES_DB:-mon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  qdrant-data:
  uploads:
